name: Tests and PyPI release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install build tools
        run: python -m pip install --upgrade build twine
      - name: Build and check distributions
        run: |
          python -m build
          python -m twine check --strict dist/*
      - name: Check release tag matches package version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from packaging.utils import parse_wheel_filename

          wheel, = Path('dist').glob('*.whl')
          _, version, _, _ = parse_wheel_filename(wheel.name)
          expected = f'v{version}'
          if os.environ['RELEASE_TAG'] != expected:
              raise SystemExit(f'Release tag must be {expected}')
          print(f'Release tag matches package version {version}')
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error

  test:
    name: Test Python ${{ matrix.python-version }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12', '3.13', '3.14', '3.15']
        include:
          - python-version: '3.8'
            torch-spec: 'torch==2.2.1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            setup.py
            pyproject.toml
      - uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist
      - name: Install CPU PyTorch and the built wheel
        env:
          TORCH_SPEC: ${{ matrix.torch-spec || 'torch>=2.2.1' }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install "$TORCH_SPEC" --index-url https://download.pytorch.org/whl/cpu
          for wheel in dist/*.whl; do
            python -m pip install "${wheel}[test]"
          done
          python -m pip check
          python -c "import sys, torch; print(sys.version); print('PyTorch:', torch.__version__)"
      - name: Test installed package outside the checkout
        run: |
          mkdir -p "$RUNNER_TEMP/fdeint-tests"
          cp -R tests "$RUNNER_TEMP/fdeint-tests/tests"
          cp Examples/Example_4_ExternalInputs.py "$RUNNER_TEMP/fdeint-tests/"
          cd "$RUNNER_TEMP/fdeint-tests"
          python -m unittest discover -s tests -t . -v
          python Example_4_ExternalInputs.py

  publish:
    name: Publish to PyPI
    if: github.event_name == 'release' && github.repository == 'zimmer-ing/FDEint'
    needs: [build, test]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/fdeint/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
